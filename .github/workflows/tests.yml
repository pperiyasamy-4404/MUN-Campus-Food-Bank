# Runs every test on GitHub for every push and pull request, so a change that breaks
# a rule shows a red cross on the commit before anyone relies on it.
name: Tests

on:
  push:
  pull_request:

jobs:
  server:
    name: Server tests (pytest, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          # A throwaway database that only exists for this run. Not a real secret.
          POSTGRES_USER: foodbank_app
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: campus_food_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbank_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://foodbank_app:ci-only@localhost:5432/campus_food_bank
      TEST_DATABASE_URL: postgresql+psycopg://foodbank_app:ci-only@localhost:5432/campus_food_bank_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Make the working database too, like a real setup
        run: PGPASSWORD=ci-only psql -h localhost -U foodbank_app -d campus_food_bank_test -c "CREATE DATABASE campus_food_bank"
      - name: A new secret key for this run only
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Run the tests
        run: python -m pytest -q

  pages:
    name: Page tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Page tests
        run: npm test
      - name: Build (also checks the types)
        run: npm run build
